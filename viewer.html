  <!--
    コア依存のプリロード（HTTP/2 Server Push クライアント側フォールバック）

    - HTTP/2環境: サーバーがLinkヘッダーでServer Pushを提供
    - HTTP/1.1環境: ブラウザがmodulepreloadを解析してプリロード

    ライブラリ利用者向け:
    1. HTML直書き（推奨）: 以下のlinkタグをコピー
    2. JavaScript動的追加: import { preloadCoreDependencies } from '@luxembourg/core/preloader';
    3. SSR/SSG: generatePreloadHTML('/path/to/lib') で生成
  -->
  <link rel="modulepreload" href="/core/web-components.js">
  <link rel="modulepreload" href="/config.js">
  <link rel="modulepreload" href="/utils/aria.js">
  <link rel="modulepreload" href="/utils/behaviors.js">
  <link rel="modulepreload" href="/utils/dom.js">
  <link rel="modulepreload" href="/styles/tokens.js">

  <style>
    :root {
      --viewer-surface: #ffffff;
      /* Contrast vs white ≈ 3.03:1 */
      --viewer-divider: #949494;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--viewer-surface);
      min-height: 100vh;
    }

    .component-selector {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .component-selector--hidden {
      display: none;
    }

    .component-pane-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 70;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: white;
      color: #0f172a;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      background: white;
      cursor: pointer;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 0;
      align-items: start;
      background: var(--viewer-surface);
      border-top: 1px solid var(--viewer-divider);
    }

    .component-viewer {
      min-width: 0;
      background: var(--viewer-surface);
    }

    #component-pane {
      position: sticky;
      top: 0;
      max-height: 100vh;
      overflow-y: auto;
      background: var(--viewer-surface);
      border-right: 1px solid var(--viewer-divider);
    }

    #component-pane > dads-layout-sidebar {
      display: block;
      min-height: 100vh;
      --dads-layout-sidebar-padding: 8px;
      --dads-layout-sidebar-background: var(--viewer-surface);
      --dads-layout-sidebar-border-color: transparent;
    }

    .component-pane__meta {
      display: grid;
      gap: 0;
      padding: 8px;
    }

    .component-pane__primary-nav {
      padding: 0 0 8px;
      margin-bottom: 8px;
    }

    .component-pane__primary-list {
      display: block;
      --dads-menu-list-font-size: 1.25rem;
    }

    .component-pane__primary-list dads-menu-list-item {
      --dads-menu-list-item-padding-y: var(--spacing-1-5, 0.375rem);
      --dads-menu-list-item-min-height: 2.875rem;
    }

    .component-pane__segment-title {
      margin: 0;
      padding: 8px;
    }

    .component-pane__segment + .component-pane__segment {
      margin-top: 8px;
      padding-top: 8px;
      position: relative;
    }

    .component-pane__segment + .component-pane__segment::before {
      content: '';
      position: absolute;
      top: 0;
      left: 8px;
      right: 8px;
      border-top: 1px solid var(--viewer-divider);
      pointer-events: none;
    }

    .component-pane__segment-list {
      display: block;
    }

    .component-pane__segment-list dads-menu-list-item {
      --dads-menu-list-item-padding-y: var(--spacing-1-5, 0.375rem);
    }

    #component-container {
      background: var(--viewer-surface);
      padding: 40px;
      border-radius: 0;
      box-shadow: none;
      min-height: 400px;
    }

    body[data-component="card"] main {
      max-width: 1440px;
      padding: 0 16px;
    }

    body[data-component="card"] #component-container {
      padding: 24px;
    }

    body[data-component="tableControl"] main {
      max-width: 1560px;
      padding: 0 16px;
    }

    body[data-component="tableControl"] #component-container {
      padding: 24px;
    }

    body[data-component="headerContainer"] main {
      max-width: 1560px;
      padding: 0 16px;
    }

    body[data-component="headerContainer"] #component-container {
      padding: 24px;
    }

    body[data-component="carousel"] main {
      max-width: 1560px;
      padding: 0 16px;
    }

    body[data-component="carousel"] #component-container {
      padding: 24px;
    }

    body[data-component="layoutShell"] main {
      max-width: 1880px;
      padding: 0 12px;
    }

    body[data-component="layoutShell"] #component-container {
      padding: 16px;
    }

    .component-pane-backdrop {
      display: none;
    }

    .loaded-log {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255,255,255,0.95);
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      max-width: 300px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 12px;
      font-family: monospace;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: none;
    }

    .loaded-log.visible {
      display: block;
    }

    .loaded-log h4 {
      margin-bottom: 8px;
      font-size: 13px;
      color: #333;
    }

    .loaded-log ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .loaded-log li {
      padding: 2px 0;
      color: #28a745;
    }

    .loaded-log li::before {
      content: '✓ ';
    }

    /* =====================================
       API / Controls Panel (viewer-only)
       ===================================== */
    .wc-api-panel {
      margin-top: 40px;
      border: 1px solid var(--color-neutral-solid-gray-100, #e5e7eb);
      border-radius: var(--border-radius-12, 12px);
      background: var(--color-neutral-white, #fff);
      overflow: hidden;
    }

    .wc-api-panel__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 16px 20px;
      background: var(--color-neutral-solid-gray-50, #f8fafc);
      border-bottom: 1px solid var(--color-neutral-solid-gray-100, #e5e7eb);
    }

    .wc-api-panel__title {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-neutral-solid-gray-900, #111827);
    }

    .wc-api-panel__body {
      display: grid;
      gap: 24px;
      padding: 20px;
    }

    /* Allow grid items to shrink so inner overflow-x (code blocks) can scroll. */
    .wc-api-panel__body > * {
      min-width: 0;
    }

    .wc-api-panel__tables > * {
      min-width: 0;
    }

    .wc-api-panel__section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-neutral-solid-gray-900, #111827);
      margin: 0 0 8px;
    }

    .wc-api-panel__section-note {
      font-size: 12px;
      color: var(--color-neutral-solid-gray-600, #6b7280);
      margin: 6px 0 0;
      line-height: 1.5;
    }

    .wc-api-panel__tables {
      display: grid;
      gap: 24px;
    }

    .wc-api-table {
      width: 100%;
      --dads-table-border-color: var(--color-neutral-solid-gray-100, #e5e7eb);
      --dads-table-header-background: var(--color-neutral-solid-gray-50, #f8fafc);
      --dads-table-body-background: var(--color-neutral-white, #fff);
    }

    .wc-api-table :is(th, td) {
      vertical-align: top;
    }

    .wc-api-table code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
    }

    .wc-api-table__meta {
      color: var(--color-neutral-solid-gray-600, #666);
      font-size: 12px;
      line-height: 1.5;
    }

    .wc-api-control {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
    }

    .wc-api-control select {
      min-width: 180px;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: var(--border-radius-8, 8px);
      font-size: 14px;
      background: var(--color-neutral-white, #fff);
    }

    .wc-api-control dads-input-text {
      --dads-input-width: 100%;
    }

    .wc-api-control dads-input-text::part(label),
    .wc-api-control dads-input-text::part(support-text),
    .wc-api-control dads-input-text::part(error-text) {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .wc-api-code {
      border: 1px solid var(--color-neutral-solid-gray-100, #e5e7eb);
      border-radius: var(--border-radius-12, 12px);
      background: var(--color-neutral-solid-gray-50, #f8fafc);
      padding: 14px;
      overflow-x: auto;
    }

    .wc-api-code pre {
      margin: 0;
      white-space: pre;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      line-height: 1.6;
      color: var(--color-neutral-solid-gray-900, #111827);
    }

    .wc-a11y-toggle {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
      padding: 16px;
      background: var(--color-neutral-solid-gray-50, #f0f4f8);
      border-radius: var(--border-radius-8, 8px);
    }

    .wc-a11y-toggle__label {
      font-weight: 600;
      color: var(--color-neutral-solid-gray-800, #333);
    }

    .wc-a11y-section__title {
      margin: 0 0 16px;
      font-size: 20px;
      color: var(--color-neutral-solid-gray-800, #333);
    }

    .wc-a11y-section__note {
      margin: 0 0 16px;
      font-size: 14px;
      color: var(--color-neutral-solid-gray-600, #666);
    }

    /* FOUC防止: 未定義のカスタム要素にスケルトン表示 */
    :not(:defined) {
      display: inline-block;
      min-width: 80px;
      min-height: 32px;
      background: linear-gradient(
        90deg,
        #f0f0f0 25%,
        #e8e8e8 50%,
        #f0f0f0 75%
      );
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.2s ease-in-out infinite;
      border-radius: 4px;
      opacity: 0.7;
    }

    @keyframes skeleton-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* 定義済み要素はフェードイン */
    :defined {
      opacity: 1;
      animation: none;
      transition: opacity 0.1s ease-out;
    }

    @media (max-width: 959px) {
      .component-pane-toggle {
        display: inline-flex;
      }

      main {
        grid-template-columns: minmax(0, 1fr);
      }

      #component-pane {
        position: fixed;
        top: 0;
        left: 0;
        width: min(86vw, 360px);
        height: 100dvh;
        max-height: none;
        border-radius: 0;
        border: 0;
        z-index: 60;
        background: var(--viewer-surface);
        transform: translateX(-100%);
        transition: transform 0.2s ease-out;
      }

      #component-pane > dads-layout-sidebar {
        --dads-layout-sidebar-background: var(--viewer-surface);
      }

      body.component-pane-mobile-open #component-pane {
        transform: translateX(0);
      }

      .component-pane-backdrop {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.48);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease-out;
        z-index: 50;
      }

      body.component-pane-mobile-open .component-pane-backdrop {
        opacity: 1;
        pointer-events: auto;
      }

      body.component-pane-mobile-open {
        overflow: hidden;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #component-pane,
      .component-pane-backdrop {
        transition: none;
      }
    }
  </style>
</head>
<body>

  <!-- Service Worker登録（キャッシュ戦略） -->
  <script>
    const params = new URLSearchParams(window.location.search);
    const hasSwCleared = params.get('swcleared') === '1';
    const forceEnableServiceWorker = params.get('sw') === '1';
    const isLocalhost = (
      window.location.hostname === 'localhost' ||
      window.location.hostname === '127.0.0.1' ||
      window.location.hostname === '0.0.0.0' ||
      window.location.hostname === '[::1]' ||
      window.location.hostname === '' ||
      window.location.hostname.endsWith('.local')
    );
    // Dev default: localhost では Service Worker を無効化（デモ更新がキャッシュで見えなくなる事故を防ぐ）
    const disableServiceWorker =
      params.get('nosw') === '1' ||
      params.get('sw') === '0' ||
      (isLocalhost && !forceEnableServiceWorker);

    async function disableServiceWorkerAndClearCaches() {
      if (!('serviceWorker' in navigator)) return;
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter((reg) => {
        const url = reg.active?.scriptURL || reg.installing?.scriptURL || reg.waiting?.scriptURL;
        if (!url) return false;
        try {
          return new URL(url).pathname.endsWith('/sw.js');
        } catch {
          return String(url).endsWith('/sw.js');
        }
      }).map((reg) => reg.unregister()));

      if (!('caches' in window)) return;
      const keys = await window.caches.keys();
      const prefixes = ['core-', 'components-'];
      await Promise.all(keys.filter((key) => prefixes.some((p) => key.startsWith(p))).map((key) => window.caches.delete(key)));
    }

    if ('serviceWorker' in navigator && !disableServiceWorker) {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('[SW] Registered:', reg.scope))
        .catch((err) => console.log('[SW] Registration failed:', err));
    }

    // Dev helper: /?nosw=1 で Service Worker を無効化（登録解除 + Cache Storage削除）
    if (disableServiceWorker) {
      disableServiceWorkerAndClearCaches()
        .then(() => {
          console.log('[SW] Disabled (nosw=1 | sw=0 | localhost default)');
          // 既にロード中のJSがSWキャッシュで古い場合があるため、一度だけリロードして揃える
          if (isLocalhost && !hasSwCleared && navigator.serviceWorker.controller) {
            const next = new URL(window.location.href);
            next.searchParams.set('nosw', '1');
            next.searchParams.set('swcleared', '1');
            window.location.replace(next.toString());
          }
        })
        .catch((err) => console.log('[SW] Disable failed:', err));
    }
  </script>

  <script type="module">
    import { demos } from '@demos';
    import { Autoloader } from '@core/autoloader';
    import { installContentTypesetStyle } from './styles/tokens.js';

    // =====================================
    // Viewer 初期化
    // =====================================
    const container = document.getElementById('component-container');
    const componentSelector = document.getElementById('component');
    const componentPane = document.getElementById('component-pane');
    const componentPaneNav = document.getElementById('component-pane-nav');
    const componentPaneToggle = document.getElementById('component-pane-toggle');
    const componentPaneBackdrop = document.getElementById('component-pane-backdrop');
    const loadedLog = document.getElementById('loaded-log');
    const loadedList = document.getElementById('loaded-list');
    const japaneseSort = new Intl.Collator('ja');
    const mobilePaneMediaQuery = window.matchMedia('(max-width: 959px)');
    const demoMaxWidthPattern = /max-width:\s*([0-9]+)px/gi;
    const componentSegmentOrder = [
      '入力・選択',
      'ナビゲーション',
      '表示・データ',
      'フィードバック',
      'レイアウト',
      'その他',
    ];
    const hiddenComponentSegments = new Set(['その他']);
    const componentSegmentByValue = {
      button: '入力・選択',
      checkbox: '入力・選択',
      radio: '入力・選択',
      fieldset: '入力・選択',
      inputText: '入力・選択',
      inputTextValidation: '入力・選択',
      fileUpload: '入力・選択',
      searchBox: '入力・選択',
      select: '入力・選択',
      selectValidation: '入力・選択',
      textarea: '入力・選択',
      textareaValidation: '入力・選択',
      switch: '入力・選択',
      calendar: '入力・選択',
      datePicker: '入力・選択',
      pageNavigation: 'ナビゲーション',
      breadcrumb: 'ナビゲーション',
      utilityLink: 'ナビゲーション',
      menuList: 'ナビゲーション',
      menuListBox: 'ナビゲーション',
      globalMenu: 'ナビゲーション',
      languageSelector: 'ナビゲーション',
      hamburgerMenuButton: 'ナビゲーション',
      mobileMenu: 'ナビゲーション',
      stepNavigation: 'ナビゲーション',
      accordion: '表示・データ',
      disclosure: '表示・データ',
      blockquote: '表示・データ',
      list: '表示・データ',
      descriptionList: '表示・データ',
      resourceList: '表示・データ',
      divider: '表示・データ',
      heading: '表示・データ',
      card: '表示・データ',
      table: '表示・データ',
      tableControl: '表示・データ',
      chipLabel: '表示・データ',
      chipTag: '表示・データ',
      carousel: '表示・データ',
      notificationBanner: 'フィードバック',
      emergencyBanner: 'フィードバック',
      dialog: 'フィードバック',
      drawer: 'フィードバック',
      headerContainer: 'レイアウト',
      layoutShell: 'レイアウト',
      resetCss: 'その他',
    };
    const kanaSortOverrides = {
      '引用ブロック': 'いんようぶろっく',
      '箇条書きリスト': 'かじょうがきりすと',
      '説明リスト': 'せつめいりすと',
      '見出し': 'みだし',
      'テーブル／データテーブル': 'てーぶるでーたてーぶる',
      'テーブルコントロール（独自）': 'てーぶるこんとろーる（どくじ）',
      'ページナビゲーション': 'ぺーじなびげーしょん',
      'パンくずリスト': 'ぱんくずりすと',
      '日付ピッカー': 'ひづけぴっかー',
      'ファイルアップロード／ドロップエリア': 'ふぁいるあっぷろーどどろっぷえりあ',
      '検索ボックス': 'けんさくぼっくす',
      '緊急時バナー': 'きんきゅうじばなー',
      'リソースリスト': 'りそーすりすと',
      'リセットCSS比較デモ（独自）': 'りせっとしーえすえすひかくでも（どくじ）',
    };
    const annotationVisibilityOverrides = {
      accordion: { lane: 'top' },
      blockquote: { lane: 'top' },
      carousel: { lane: 'top' },
      checkbox: { lane: 'top' },
      disclosure: { lane: 'top' },
      drawer: { lane: 'top' },
      fieldset: { lane: 'top' },
      globalMenu: { lane: 'top' },
      pageNavigation: { lane: 'top' },
      stepNavigation: { lane: 'top' },
      tableControl: { lane: 'top' },
    };

    let currentAutoloader = null;
    const loadedComponents = new Set();
    let isComponentPaneOpen = false;
    installContentTypesetStyle(document);

    function onComponentLoad(tagName) {
      loadedComponents.add(tagName);
      updateLoadedLog();
    }

    function updateLoadedLog() {
      loadedList.innerHTML = '';
      for (const name of loadedComponents) {
        const li = document.createElement('li');
        li.textContent = name;
        loadedList.appendChild(li);
      }
      if (loadedComponents.size > 0) {
        loadedLog.classList.add('visible');
      }
    }

    function showComponent(name) {
      const demoFn = demos[name] || demos.empty;
      document.body.dataset.component = name;
      syncViewerFrameWidth(widestDemoWidthPx);
      container.innerHTML = demoFn();
      applyTypesetToDemoRoot(container);
      applyAnnotationVisibilityOverrides(name, container);
      normalizeViewWidth(container, widestDemoWidthPx);
      activateEmbeddedScripts(container);
      updateActiveComponentItem(name in demos ? name : '');
    }

    function applyTypesetToDemoRoot(root) {
      if (!(root instanceof HTMLElement)) return;
      if (root.querySelector('[data-dads-typeset]')) return;
      const firstElement = root.firstElementChild;
      if (firstElement instanceof HTMLElement) {
        firstElement.setAttribute('data-dads-typeset', '');
      }
    }

    function detectWidestDemoWidthPx() {
      let widest = 0;
      const demoFns = Object.values(demos);

      for (const demoFn of demoFns) {
        if (typeof demoFn !== 'function') continue;
        const html = String(demoFn() ?? '');
        demoMaxWidthPattern.lastIndex = 0;

        let match = demoMaxWidthPattern.exec(html);
        while (match) {
          const width = Number.parseInt(match[1], 10);
          if (Number.isFinite(width) && width > widest) widest = width;
          match = demoMaxWidthPattern.exec(html);
        }
      }

      return widest > 0 ? widest : 1600;
    }

    function normalizeViewWidth(root, maxWidthPx) {
      const viewRoot =
        Array.from(root.children).find((element) =>
          element instanceof HTMLElement &&
          ((element.getAttribute('style') ?? '').includes('max-width:') || element.style.maxWidth)
        ) ?? root.firstElementChild;

      if (!(viewRoot instanceof HTMLElement)) return;
      viewRoot.style.maxWidth = `${maxWidthPx}px`;
    }

    function applyAnnotationVisibilityOverrides(componentName, root) {
      const override = annotationVisibilityOverrides[componentName];
      if (!override) return;

      const annotations = root.querySelectorAll('a11y-annotate');
      for (const annotation of annotations) {
        if (!(annotation instanceof HTMLElement)) continue;
        if (override.lane) annotation.setAttribute('callout-lane', override.lane);
      }
    }

    function syncViewerFrameWidth(maxWidthPx) {
      const main = document.querySelector('main');
      if (!(main instanceof HTMLElement)) return;

      const mainStyles = getComputedStyle(main);
      const containerStyles = getComputedStyle(container);
      const mainHorizontalPadding =
        Number.parseFloat(mainStyles.paddingLeft) + Number.parseFloat(mainStyles.paddingRight);
      const containerHorizontalPadding =
        Number.parseFloat(containerStyles.paddingLeft) + Number.parseFloat(containerStyles.paddingRight);
      const sidebarWidth = componentPane instanceof HTMLElement && !isMobilePaneMode()
        ? componentPane.getBoundingClientRect().width
        : 0;
      const mainGap = !isMobilePaneMode()
        ? Number.parseFloat(mainStyles.columnGap || mainStyles.gap || '0')
        : 0;

      const frameWidth = Math.ceil(
        maxWidthPx + mainHorizontalPadding + containerHorizontalPadding + sidebarWidth + mainGap
      );
      main.style.maxWidth = `${frameWidth}px`;
    }

    const widestDemoWidthPx = detectWidestDemoWidthPx();

    function toHiragana(text) {
      return text
        .normalize('NFKC')
        .replace(/[\u30a1-\u30f6]/g, (char) =>
          String.fromCharCode(char.charCodeAt(0) - 0x60)
        );
    }

    function optionSortKey(option) {
      const label = option.textContent?.trim() ?? '';
      return kanaSortOverrides[label] ?? toHiragana(label);
    }

    function componentSortKey(component) {
      return kanaSortOverrides[component.label] ?? toHiragana(component.label);
    }

    function sortComponentOptionsByKana(selectElement) {
      const placeholder = selectElement.querySelector('option[value=""]');
      const sortable = Array.from(selectElement.options).filter(
        (option) => option.value !== ''
      );
      sortable.sort((a, b) => {
        const byReading = japaneseSort.compare(optionSortKey(a), optionSortKey(b));
        if (byReading !== 0) return byReading;
        return japaneseSort.compare(a.textContent?.trim() ?? '', b.textContent?.trim() ?? '');
      });

      selectElement.innerHTML = '';
      if (placeholder) {
        selectElement.appendChild(placeholder);
      }
      for (const option of sortable) {
        selectElement.appendChild(option);
      }
    }

    function isMobilePaneMode() {
      return mobilePaneMediaQuery.matches;
    }

    function getSelectableComponents() {
      if (!(componentSelector instanceof HTMLSelectElement)) return [];
      return Array.from(componentSelector.options)
        .filter((option) => option.value !== '' && option.value !== 'resetCss')
        .map((option) => ({
          value: option.value,
          label: option.textContent?.trim() ?? '',
        }));
    }

    function buildSegmentedComponents(components) {
      const segmented = new Map(componentSegmentOrder.map((segment) => [segment, []]));
      for (const component of components) {
        const segment = componentSegmentByValue[component.value] ?? 'その他';
        const list = segmented.get(segment);
        if (list) list.push(component);
      }

      for (const segment of componentSegmentOrder) {
        const entries = segmented.get(segment) ?? [];
        entries.sort((a, b) => {
          const byReading = japaneseSort.compare(componentSortKey(a), componentSortKey(b));
          if (byReading !== 0) return byReading;
          return japaneseSort.compare(a.label, b.label);
        });
      }

      return segmented;
    }

    function renderComponentPane() {
      if (!(componentPaneNav instanceof HTMLElement)) return;
      componentPaneNav.innerHTML = '';
      const segmentedComponents = buildSegmentedComponents(getSelectableComponents());

      for (const segment of componentSegmentOrder) {
        if (hiddenComponentSegments.has(segment)) continue;
        const components = segmentedComponents.get(segment) ?? [];
        if (components.length === 0) continue;

        const section = document.createElement('section');
        section.className = 'component-pane__segment';

        const heading = document.createElement('dads-heading');
        heading.className = 'component-pane__segment-title';
        heading.setAttribute('level', '3');
        heading.setAttribute('size', '16');
        heading.setAttribute('margin', 'none');
        heading.textContent = segment;
        section.appendChild(heading);

        const list = document.createElement('dads-menu-list');
        list.className = 'component-pane__segment-list';
        for (const component of components) {
          const item = document.createElement('dads-menu-list-item');
          item.dataset.component = component.value;
          item.textContent = component.label;
          list.appendChild(item);
        }

        section.appendChild(list);
        componentPaneNav.appendChild(section);
      }
    }

    function updateActiveComponentItem(componentName) {
      if (componentPaneNav instanceof HTMLElement) {
        const items = componentPaneNav.querySelectorAll('dads-menu-list-item[data-component]');
        for (const item of items) {
          if (!(item instanceof HTMLElement)) continue;
          if (item.dataset.component === componentName) {
            item.setAttribute('current', '');
            item.setAttribute('aria-current', 'page');
          } else {
            item.removeAttribute('current');
            item.removeAttribute('aria-current');
          }
        }
      }

      if (componentSelector instanceof HTMLSelectElement) {
        componentSelector.value = componentName || '';
      }
    }

    function updateComponentQuery(value) {
      const url = new URL(window.location.href);
      if (value) {
        url.searchParams.set('component', value);
      } else {
        url.searchParams.delete('component');
      }
      window.history.pushState({}, '', url);
    }

    function getPaneFocusableElements() {
      if (!(componentPane instanceof HTMLElement)) return [];
      const componentItems = Array.from(
        componentPane.querySelectorAll('dads-menu-list-item[data-component]')
      ).filter((element) => element instanceof HTMLElement);

      const selectors = [
        'button:not([disabled])',
        '[href]',
        'input:not([disabled])',
        'select:not([disabled])',
        'textarea:not([disabled])',
        '[tabindex]:not([tabindex="-1"])',
      ];
      const genericFocusable = Array.from(componentPane.querySelectorAll(selectors.join(',')))
        .filter((element) => element instanceof HTMLElement);
      const merged = [...componentItems, ...genericFocusable];
      const unique = [];
      const seen = new Set();
      for (const element of merged) {
        if (!(element instanceof HTMLElement)) continue;
        if (seen.has(element)) continue;
        if (element.getAttribute('aria-hidden') === 'true') continue;
        if (element.getClientRects().length === 0) continue;
        seen.add(element);
        unique.push(element);
      }
      return unique;
    }

    function closeComponentPane(options = {}) {
      const { returnFocus = true } = options;
      if (!(componentPaneToggle instanceof HTMLElement)) return;
      isComponentPaneOpen = false;
      document.body.classList.remove('component-pane-mobile-open');
      componentPaneToggle.setAttribute('aria-expanded', 'false');
      if (returnFocus) {
        componentPaneToggle.focus();
      }
    }

    function openComponentPane() {
      if (!(componentPaneToggle instanceof HTMLElement) || !(componentPane instanceof HTMLElement)) return;
      if (!isMobilePaneMode()) return;
      isComponentPaneOpen = true;
      document.body.classList.add('component-pane-mobile-open');
      componentPaneToggle.setAttribute('aria-expanded', 'true');
      const firstComponentItem = componentPane.querySelector('dads-menu-list-item[data-component]');
      if (firstComponentItem instanceof HTMLElement) {
        firstComponentItem.focus();
        return;
      }
      const focusables = getPaneFocusableElements();
      if (focusables.length > 0) {
        focusables[0].focus();
      } else {
        componentPane.focus();
      }
    }

    function toggleComponentPane() {
      if (!isMobilePaneMode()) return;
      if (isComponentPaneOpen) {
        closeComponentPane();
      } else {
        openComponentPane();
      }
    }

    function handleComponentPaneKeydown(event) {
      if (!isComponentPaneOpen || !isMobilePaneMode()) return;

      if (event.key === 'Escape') {
        event.preventDefault();
        closeComponentPane();
        return;
      }

      if (event.key !== 'Tab') return;
      const focusables = getPaneFocusableElements();
      if (focusables.length === 0) {
        event.preventDefault();
        if (componentPane instanceof HTMLElement) componentPane.focus();
        return;
      }

      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      const active = document.activeElement;
      if (!(active instanceof HTMLElement) || !(componentPane instanceof HTMLElement) || !componentPane.contains(active)) {
        event.preventDefault();
        first.focus();
        return;
      }

      if (event.shiftKey && active === first) {
        event.preventDefault();
        last.focus();
        return;
      }

      if (!event.shiftKey && active === last) {
        event.preventDefault();
        first.focus();
      }
    }

    function onViewportBreakpointChange() {
      if (!isMobilePaneMode() && isComponentPaneOpen) {
        closeComponentPane({ returnFocus: false });
      }
    }

    // innerHTMLで挿入したscriptは実行されないため、必要に応じて再評価する
    function activateEmbeddedScripts(root) {
      const scripts = root.querySelectorAll('script');
      for (const oldScript of scripts) {
        const script = document.createElement('script');
        for (const attr of oldScript.attributes) {
          script.setAttribute(attr.name, attr.value);
        }
        script.textContent = oldScript.textContent;
        oldScript.parentNode?.replaceChild(script, oldScript);
      }
    }

    function initAutoloader() {
      console.log('[Autoloader] Starting...');
      currentAutoloader = new Autoloader({
        debug: true,
        onLoad: onComponentLoad
      });
      currentAutoloader.start();
    }

    if (componentSelector instanceof HTMLSelectElement) {
      componentSelector.addEventListener('change', (e) => {
        const value = e.target.value;
        updateComponentQuery(value);
        showComponent(value || 'empty');
      });
    }

    if (componentPaneNav instanceof HTMLElement) {
      componentPaneNav.addEventListener('click', (event) => {
        const target = event.target instanceof HTMLElement
          ? event.target.closest('dads-menu-list-item[data-component]')
          : null;
        if (!(target instanceof HTMLElement)) return;
        const value = target.dataset.component ?? '';
        updateComponentQuery(value);
        showComponent(value || 'empty');
        if (isMobilePaneMode()) {
          closeComponentPane();
        }
      });
    }

    if (componentPaneToggle instanceof HTMLElement) {
      componentPaneToggle.addEventListener('click', toggleComponentPane);
    }

    if (componentPaneBackdrop instanceof HTMLElement) {
      componentPaneBackdrop.addEventListener('click', () => {
        if (!isComponentPaneOpen) return;
        closeComponentPane();
      });
    }

    document.addEventListener('keydown', handleComponentPaneKeydown);
    mobilePaneMediaQuery.addEventListener('change', onViewportBreakpointChange);

    // 初期化
    if (componentSelector instanceof HTMLSelectElement) {
      sortComponentOptionsByKana(componentSelector);
    }
    renderComponentPane();
    const params = new URLSearchParams(window.location.search);
    const initialComponent = params.get('component');

    // Autoloaderを初期化
    initAutoloader();

    // 初期コンポーネントを表示
    if (initialComponent && initialComponent in demos) {
      showComponent(initialComponent);
    } else {
      showComponent('empty');
    }

    // デバッグ用にグローバルに公開
    window.componentDemos = demos;
    window.loadedComponents = loadedComponents;

    // =====================================
    // コンポーネントプリロード
    // =====================================

    // 即時ロードが必要なコンポーネント（フォーム操作に関わるもの）
    // これらは遅延ロードだとユーザー操作に支障が出る
    const criticalComponents = [
      '/@components/dads/button.js'
    ];

    // バックグラウンドプリロード対象（アイドル時にロード）
    const componentAdapters = [
      '/@components/dads/table.js',
      '/@components/dads/table-control.js',
      '/@components/dads/textarea.js',
      '/@components/dads/input-text.js',
      '/@components/dads/file-upload.js',
      '/@components/dads/select.js',
      '/@components/dads/calendar.js',
      '/@components/dads/date-picker.js',
      '/@components/dads/dialog.js',
      '/@components/dads/drawer.js',
      '/@components/dads/header-container.js',
      '/@components/dads/hamburger-menu-button.js',
      '/@components/dads/mobile-menu.js',
      '/@components/dads/device-mock.js',
      '/@components/dads/checkbox.js',
      '/@components/dads/radio.js',
      '/@components/dads/chip-label.js',
      '/@components/dads/chip-tag.js',
      '/@components/dads/accordion-details.js',
      '/@components/dads/accordion-item-details.js',
      '/@components/dads/blockquote.js',
      '/@components/dads/divider.js',
      '/@components/dads/heading.js',
      '/@components/dads/text.js',
      '/@components/dads/switch.js',
      '/@components/dads/resource-list.js',
      '/@components/dads/menu-list.js',
      '/@components/dads/menu-list-box.js',
      '/@components/dads/global-menu.js',
      '/@components/dads/utility-link.js',
      '/@components/dads/language-selector.js',
      '/@components/dads/notification-banner.js',
      '/@components/dads/emergency-banner.js',
      '/@components/dads/carousel.js'
    ];

    // クリティカルコンポーネントを即座にロード
    function loadCriticalComponents() {
      console.log('[Preloader] Loading critical components...');
      for (const path of criticalComponents) {
        import(path).then(() => {
          console.log(`[Preloader] Critical: ${path} loaded`);
        }).catch(err => {
          console.warn(`[Preloader] Failed to load ${path}:`, err);
        });
      }
    }

    // 即座に実行
    loadCriticalComponents();

    function preloadComponents() {
      console.log('[Preloader] Starting background preload...');
      const promises = componentAdapters.map(path => {
        const link = document.createElement('link');
        link.rel = 'modulepreload';
        link.href = path;
        document.head.appendChild(link);
        return new Promise(resolve => {
          link.onload = resolve;
          link.onerror = resolve; // エラーでも継続
        });
      });
      Promise.all(promises).then(() => {
        console.log('[Preloader] Background preload complete');
      });
    }

    // requestIdleCallbackが使えない場合はsetTimeoutでフォールバック
    if ('requestIdleCallback' in window) {
      requestIdleCallback(preloadComponents, { timeout: 2000 });
    } else {
      setTimeout(preloadComponents, 100);
    }
  </script>
