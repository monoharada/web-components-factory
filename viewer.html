  <!--
    コア依存のプリロード（HTTP/2 Server Push クライアント側フォールバック）

    - HTTP/2環境: サーバーがLinkヘッダーでServer Pushを提供
    - HTTP/1.1環境: ブラウザがmodulepreloadを解析してプリロード

    ライブラリ利用者向け:
    1. HTML直書き（推奨）: 以下のlinkタグをコピー
    2. JavaScript動的追加: import { preloadCoreDependencies } from '@luxembourg/core/preloader';
    3. SSR/SSG: generatePreloadHTML('/path/to/lib') で生成
  -->
  <link rel="modulepreload" href="/core/web-components.js">
  <link rel="modulepreload" href="/config.js">
  <link rel="modulepreload" href="/utils/aria.js">

      background-size: 200% 100%;
      animation: skeleton-shimmer 1.2s ease-in-out infinite;
      border-radius: 4px;
      opacity: 0.7;
    }

    @keyframes skeleton-shimmer {

    :defined {
      opacity: 1;
      animation: none;
      background: none;
      transition: opacity 0.1s ease-out;

  <!-- Service Worker登録（キャッシュ戦略） -->
  <script>
    const params = new URLSearchParams(window.location.search);
    const hasSwCleared = params.get('swcleared') === '1';
    const forceEnableServiceWorker = params.get('sw') === '1';
    const isLocalhost = (
      window.location.hostname === 'localhost' ||
      window.location.hostname === '127.0.0.1' ||
      window.location.hostname === '0.0.0.0' ||
      window.location.hostname === '[::1]' ||
      window.location.hostname === '' ||
      window.location.hostname.endsWith('.local')
    );
    // Dev default: localhost では Service Worker を無効化（デモ更新がキャッシュで見えなくなる事故を防ぐ）
    const disableServiceWorker =
      params.get('nosw') === '1' ||
      params.get('sw') === '0' ||
      (isLocalhost && !forceEnableServiceWorker);

    async function disableServiceWorkerAndClearCaches() {
      if (!('serviceWorker' in navigator)) return;
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter((reg) => {
        const url = reg.active?.scriptURL || reg.installing?.scriptURL || reg.waiting?.scriptURL;
        if (!url) return false;
        try {
          return new URL(url).pathname.endsWith('/sw.js');
        } catch {
          return String(url).endsWith('/sw.js');
        }
      }).map((reg) => reg.unregister()));

      if (!('caches' in window)) return;
      const keys = await window.caches.keys();
      const prefixes = ['core-', 'components-'];
      await Promise.all(keys.filter((key) => prefixes.some((p) => key.startsWith(p))).map((key) => window.caches.delete(key)));
    }

    if ('serviceWorker' in navigator && !disableServiceWorker) {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('[SW] Registered:', reg.scope))
        .catch((err) => console.log('[SW] Registration failed:', err));
    }

    // Dev helper: /?nosw=1 で Service Worker を無効化（登録解除 + Cache Storage削除）
    if (disableServiceWorker) {
      disableServiceWorkerAndClearCaches()
        .then(() => {
          console.log('[SW] Disabled (nosw=1 | sw=0 | localhost default)');
          // 既にロード中のJSがSWキャッシュで古い場合があるため、一度だけリロードして揃える
          if (isLocalhost && !hasSwCleared && navigator.serviceWorker.controller) {
            const next = new URL(window.location.href);
            next.searchParams.set('nosw', '1');
            next.searchParams.set('swcleared', '1');
            window.location.replace(next.toString());
          }
        })
        .catch((err) => console.log('[SW] Disable failed:', err));
    }
  </script>

  <script type="module">
    import { demos } from '@demos';
    import { Autoloader } from '@core/autoloader';

    // =====================================
    // Viewer 初期化
    // =====================================
    const container = document.getElementById('component-container');
    const componentSelector = document.getElementById('component');
    const loadedLog = document.getElementById('loaded-log');
    const loadedList = document.getElementById('loaded-list');

    let currentAutoloader = null;
    const loadedComponents = new Set();

    function onComponentLoad(tagName) {
      loadedComponents.add(tagName);
      updateLoadedLog();
    }

    function updateLoadedLog() {
      loadedList.innerHTML = '';
      for (const name of loadedComponents) {
        const li = document.createElement('li');
        li.textContent = name;
        loadedList.appendChild(li);
      }
      if (loadedComponents.size > 0) {
        loadedLog.classList.add('visible');
      }
    }

    function showComponent(name) {
      const demoFn = demos[name] || demos.empty;
      document.body.dataset.component = name;
      container.innerHTML = demoFn();
      activateEmbeddedScripts(container);
    }

    // innerHTMLで挿入したscriptは実行されないため、必要に応じて再評価する
    function activateEmbeddedScripts(root) {
      const scripts = root.querySelectorAll('script');
      for (const oldScript of scripts) {
        const script = document.createElement('script');
        for (const attr of oldScript.attributes) {
          script.setAttribute(attr.name, attr.value);
        }
        script.textContent = oldScript.textContent;
        oldScript.parentNode?.replaceChild(script, oldScript);
      }
    }

    function initAutoloader() {
      console.log('[Autoloader] Starting...');
      currentAutoloader = new Autoloader({
        debug: true,
        onLoad: onComponentLoad
      });
      currentAutoloader.start();
    }

    // コンポーネントセレクタの変更
    componentSelector.addEventListener('change', (e) => {
      const value = e.target.value;

      // URLパラメータを更新
      const url = new URL(window.location.href);
      if (value) {
        url.searchParams.set('component', value);
      } else {
        url.searchParams.delete('component');
      }
      window.history.pushState({}, '', url);

      // コンポーネントを表示
      showComponent(value || 'empty');
    });

    // 初期化
    const params = new URLSearchParams(window.location.search);
    const initialComponent = params.get('component');

    // Autoloaderを初期化
    initAutoloader();

    // 初期コンポーネントを表示
    if (initialComponent) {
      componentSelector.value = initialComponent;
      showComponent(initialComponent);
    } else {
      showComponent('empty');
    }

    // デバッグ用にグローバルに公開
    window.componentDemos = demos;
    window.loadedComponents = loadedComponents;

    // =====================================
    // コンポーネントプリロード
    // =====================================

    // 即時ロードが必要なコンポーネント（フォーム操作に関わるもの）
    // これらは遅延ロードだとユーザー操作に支障が出る
    const criticalComponents = [
      '/@components/dads/button.js'
    ];

    // バックグラウンドプリロード対象（アイドル時にロード）
    const componentAdapters = [
      '/@components/dads/table.js',
      '/@components/dads/table-control.js',
      '/@components/dads/textarea.js',
      '/@components/dads/input-text.js',
      '/@components/dads/file-upload.js',
      '/@components/dads/select.js',
      '/@components/dads/calendar.js',
      '/@components/dads/date-picker.js',
      '/@components/dads/checkbox.js',
      '/@components/dads/radio.js',
      '/@components/dads/chip-label.js',
      '/@components/dads/chip-tag.js',
      '/@components/dads/accordion-details.js',
      '/@components/dads/accordion-item-details.js',
      '/@components/dads/blockquote.js',
      '/@components/dads/heading.js',
      '/@components/dads/text.js',
      '/@components/dads/switch.js',
      '/@components/dads/menu-list.js',
      '/@components/dads/menu-list-box.js',
      '/@components/dads/notification-banner.js'
    ];

    // クリティカルコンポーネントを即座にロード
    function loadCriticalComponents() {
      console.log('[Preloader] Loading critical components...');
      for (const path of criticalComponents) {
        import(path).then(() => {
          console.log(`[Preloader] Critical: ${path} loaded`);
        }).catch(err => {
          console.warn(`[Preloader] Failed to load ${path}:`, err);
        });
      }
    }

    // 即座に実行
    loadCriticalComponents();

    function preloadComponents() {
      console.log('[Preloader] Starting background preload...');
      const promises = componentAdapters.map(path => {
        const link = document.createElement('link');
        link.rel = 'modulepreload';
        link.href = path;
        document.head.appendChild(link);
        return new Promise(resolve => {
          link.onload = resolve;
          link.onerror = resolve; // エラーでも継続
        });
      });
      Promise.all(promises).then(() => {
        console.log('[Preloader] Background preload complete');
      });
    }

    // requestIdleCallbackが使えない場合はsetTimeoutでフォールバック
    if ('requestIdleCallback' in window) {
      requestIdleCallback(preloadComponents, { timeout: 2000 });
    } else {
      setTimeout(preloadComponents, 100);
    }
  </script>
