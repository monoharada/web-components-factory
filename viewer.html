  <!--
    コア依存のプリロード（HTTP/2 Server Push クライアント側フォールバック）

    - HTTP/2環境: サーバーがLinkヘッダーでServer Pushを提供
    - HTTP/1.1環境: ブラウザがmodulepreloadを解析してプリロード

    ライブラリ利用者向け:
    1. HTML直書き（推奨）: 以下のlinkタグをコピー
    2. JavaScript動的追加: import { preloadCoreDependencies } from '@luxembourg/core/preloader';
    3. SSR/SSG: generatePreloadHTML('/path/to/lib') で生成
  -->

        #f0f0f0 25%,

      );
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.2s ease-in-out infinite;

      opacity: 0.7;

    :defined {

  <!-- Service Worker登録（キャッシュ戦略） -->
  <script>
    const params = new URLSearchParams(window.location.search);
    const hasSwCleared = params.get('swcleared') === '1';
    const forceEnableServiceWorker = params.get('sw') === '1';
    const isLocalhost = (
      window.location.hostname === 'localhost' ||
      window.location.hostname === '127.0.0.1' ||
      window.location.hostname === '0.0.0.0' ||
      window.location.hostname === '[::1]' ||
      window.location.hostname === '' ||
      window.location.hostname.endsWith('.local')
    );
    // Dev default: localhost では Service Worker を無効化（デモ更新がキャッシュで見えなくなる事故を防ぐ）
    const disableServiceWorker =
      params.get('nosw') === '1' ||
      params.get('sw') === '0' ||
      (isLocalhost && !forceEnableServiceWorker);

    async function disableServiceWorkerAndClearCaches() {
      if (!('serviceWorker' in navigator)) return;
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter((reg) => {
        const url = reg.active?.scriptURL || reg.installing?.scriptURL || reg.waiting?.scriptURL;
        if (!url) return false;
        try {
          return new URL(url).pathname.endsWith('/sw.js');
        } catch {
          return String(url).endsWith('/sw.js');
        }
      }).map((reg) => reg.unregister()));

      if (!('caches' in window)) return;
      const keys = await window.caches.keys();
      const prefixes = ['core-', 'components-'];
      await Promise.all(keys.filter((key) => prefixes.some((p) => key.startsWith(p))).map((key) => window.caches.delete(key)));
    }

    if ('serviceWorker' in navigator && !disableServiceWorker) {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('[SW] Registered:', reg.scope))
        .catch((err) => console.log('[SW] Registration failed:', err));
    }

    // Dev helper: /?nosw=1 で Service Worker を無効化（登録解除 + Cache Storage削除）
    if (disableServiceWorker) {
      disableServiceWorkerAndClearCaches()
        .then(() => {
          console.log('[SW] Disabled (nosw=1 | sw=0 | localhost default)');
          // 既にロード中のJSがSWキャッシュで古い場合があるため、一度だけリロードして揃える
          if (isLocalhost && !hasSwCleared && navigator.serviceWorker.controller) {
            const next = new URL(window.location.href);
            next.searchParams.set('nosw', '1');
            next.searchParams.set('swcleared', '1');
            window.location.replace(next.toString());
          }
        })
        .catch((err) => console.log('[SW] Disable failed:', err));
    }
  </script>

  <script type="module">
    import { demos } from '@demos';
    import { Autoloader } from '@core/autoloader';
    import { installContentTypesetStyle } from './styles/tokens.js';
    import {
      buildInstallCommands,
      createInstallPanelElement,
      extractInstallComponentIdsFromManifest,
      findInstallAnchor,
      isLocalhostHost,
      resolveComponentId,
    } from './src/viewer-install-panel.js';

    // =====================================
    // Viewer 初期化
    // =====================================
    const container = document.getElementById('component-container');
    const componentSelector = document.getElementById('component');
    const loadedLog = document.getElementById('loaded-log');
    const loadedList = document.getElementById('loaded-list');
    const japaneseSort = new Intl.Collator('ja');
    const demoMaxWidthPattern = /max-width:\s*([0-9]+)px/gi;
    const kanaSortOverrides = {
      '引用ブロック': 'いんようぶろっく',
      '箇条書きリスト': 'かじょうがきりすと',
      '説明リスト': 'せつめいりすと',
      '見出し': 'みだし',
      'テーブル／データテーブル': 'てーぶるでーたてーぶる',
      'テーブルコントロール（独自）': 'てーぶるこんとろーる（どくじ）',
      'ページナビゲーション': 'ぺーじなびげーしょん',
      'パンくずリスト': 'ぱんくずりすと',
      '日付ピッカー': 'ひづけぴっかー',
      'ファイルアップロード／ドロップエリア': 'ふぁいるあっぷろーどどろっぷえりあ',
      '検索ボックス': 'けんさくぼっくす',
      '緊急時バナー': 'きんきゅうじばなー',
      'リソースリスト': 'りそーすりすと',
      'リセットCSS比較デモ（独自）': 'りせっとしーえすえすひかくでも（どくじ）',
    };
    const annotationVisibilityOverrides = {
      accordion: { lane: 'top' },
      blockquote: { lane: 'top' },
      carousel: { lane: 'top' },
      checkbox: { lane: 'top' },
      disclosure: { lane: 'top' },
      drawer: { lane: 'top' },
      fieldset: { lane: 'top' },
      globalMenu: { lane: 'top' },
      pageNavigation: { lane: 'top' },
      stepNavigation: { lane: 'top' },
      tableControl: { lane: 'top' },
    };

    let currentAutoloader = null;
    const loadedComponents = new Set();
    let componentRenderSeq = 0;
    let installIdSetPromise = null;
    installContentTypesetStyle(document);

    function onComponentLoad(tagName) {
      loadedComponents.add(tagName);
      updateLoadedLog();
    }

    function updateLoadedLog() {
      loadedList.innerHTML = '';
      for (const name of loadedComponents) {
        const li = document.createElement('li');
        li.textContent = name;
        loadedList.appendChild(li);
      }
      if (loadedComponents.size > 0) {
        loadedLog.classList.add('visible');
      }
    }

    function showComponent(name) {
      const renderSeq = ++componentRenderSeq;
      const demoFn = demos[name] || demos.empty;
      document.body.dataset.component = name;
      syncViewerFrameWidth(widestDemoWidthPx);
      container.innerHTML = demoFn();
      applyTypesetToDemoRoot(container);
      applyAnnotationVisibilityOverrides(name, container);
      normalizeViewWidth(container, widestDemoWidthPx);
      activateEmbeddedScripts(container);
      void renderInstallPanel(name, container, renderSeq);
    }

    function warnInstallPanelDev(message, error) {
      if (!isLocalhostHost(window.location.hostname)) return;
      if (error) {
        console.warn(`[Viewer Install] ${message}`, error);
        return;
      }
      console.warn(`[Viewer Install] ${message}`);
    }

    function loadInstallComponentIds() {
      if (installIdSetPromise) return installIdSetPromise;

      installIdSetPromise = fetch('./custom-elements.json')
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Failed to load custom-elements.json (${response.status})`);
          }
          return response.json();
        })
        .then((manifest) => extractInstallComponentIdsFromManifest(manifest))
        .catch((error) => {
          warnInstallPanelDev('custom-elements.json の読み込みに失敗したため Install 表示をスキップします。', error);
          return new Set();
        });

      return installIdSetPromise;
    }

    async function renderInstallPanel(componentName, root, renderSeq) {
      if (componentName === 'empty' || componentName === 'resetCss') return;

      const installIds = await loadInstallComponentIds();
      if (renderSeq !== componentRenderSeq) return;

      const componentId = resolveComponentId(componentName, installIds);
      if (!componentId) {
        warnInstallPanelDev(`componentId を解決できないため Install 表示をスキップします: ${componentName}`);
        return;
      }

      const anchor = findInstallAnchor(root);
      if (!anchor) {
        warnInstallPanelDev(`見出しアンカーが見つからないため Install 表示をスキップします: ${componentName}`);
        return;
      }

      const commands = buildInstallCommands(componentId);
      const panel = createInstallPanelElement(componentId, commands);
      anchor.insertAdjacentElement('afterend', panel);
    }

    function applyTypesetToDemoRoot(root) {
      if (!(root instanceof HTMLElement)) return;
      if (root.querySelector('[data-dads-typeset]')) return;
      const firstElement = root.firstElementChild;
      if (firstElement instanceof HTMLElement) {
        firstElement.setAttribute('data-dads-typeset', '');
      }
    }

    function detectWidestDemoWidthPx() {
      let widest = 0;
      const demoFns = Object.values(demos);

      for (const demoFn of demoFns) {
        if (typeof demoFn !== 'function') continue;
        const html = String(demoFn() ?? '');
        demoMaxWidthPattern.lastIndex = 0;

        let match = demoMaxWidthPattern.exec(html);
        while (match) {
          const width = Number.parseInt(match[1], 10);
          if (Number.isFinite(width) && width > widest) widest = width;
          match = demoMaxWidthPattern.exec(html);
        }
      }

      return widest > 0 ? widest : 1600;
    }

    function normalizeViewWidth(root, maxWidthPx) {
      const viewRoot =
        Array.from(root.children).find((element) =>
          element instanceof HTMLElement &&
          ((element.getAttribute('style') ?? '').includes('max-width:') || element.style.maxWidth)
        ) ?? root.firstElementChild;

      if (!(viewRoot instanceof HTMLElement)) return;
      viewRoot.style.maxWidth = `${maxWidthPx}px`;
    }

    function applyAnnotationVisibilityOverrides(componentName, root) {
      const override = annotationVisibilityOverrides[componentName];
      if (!override) return;

      const annotations = root.querySelectorAll('a11y-annotate');
      for (const annotation of annotations) {
        if (!(annotation instanceof HTMLElement)) continue;
        if (override.lane) annotation.setAttribute('callout-lane', override.lane);
      }
    }

    function syncViewerFrameWidth(maxWidthPx) {
      const main = document.querySelector('main');
      if (!(main instanceof HTMLElement)) return;

      const mainStyles = getComputedStyle(main);
      const containerStyles = getComputedStyle(container);
      const mainHorizontalPadding =
        Number.parseFloat(mainStyles.paddingLeft) + Number.parseFloat(mainStyles.paddingRight);
      const containerHorizontalPadding =
        Number.parseFloat(containerStyles.paddingLeft) + Number.parseFloat(containerStyles.paddingRight);

      const frameWidth = Math.ceil(maxWidthPx + mainHorizontalPadding + containerHorizontalPadding);
      main.style.maxWidth = `${frameWidth}px`;
    }

    const widestDemoWidthPx = detectWidestDemoWidthPx();

    function toHiragana(text) {
      return text
        .normalize('NFKC')
        .replace(/[\u30a1-\u30f6]/g, (char) =>
          String.fromCharCode(char.charCodeAt(0) - 0x60)
        );
    }

    function optionSortKey(option) {
      const label = option.textContent?.trim() ?? '';
      return kanaSortOverrides[label] ?? toHiragana(label);
    }

    function sortComponentOptionsByKana(selectElement) {
      const placeholder = selectElement.querySelector('option[value=""]');
      const sortable = Array.from(selectElement.options).filter(
        (option) => option.value !== ''
      );
      sortable.sort((a, b) => {
        const byReading = japaneseSort.compare(optionSortKey(a), optionSortKey(b));
        if (byReading !== 0) return byReading;
        return japaneseSort.compare(a.textContent?.trim() ?? '', b.textContent?.trim() ?? '');
      });

      selectElement.innerHTML = '';
      if (placeholder) {
        selectElement.appendChild(placeholder);
      }
      for (const option of sortable) {
        selectElement.appendChild(option);
      }
    }

    // innerHTMLで挿入したscriptは実行されないため、必要に応じて再評価する
    function activateEmbeddedScripts(root) {
      const scripts = root.querySelectorAll('script');
      for (const oldScript of scripts) {
        const script = document.createElement('script');
        for (const attr of oldScript.attributes) {
          script.setAttribute(attr.name, attr.value);
        }
        script.textContent = oldScript.textContent;
        oldScript.parentNode?.replaceChild(script, oldScript);
      }
    }

    function initAutoloader() {
      console.log('[Autoloader] Starting...');
      currentAutoloader = new Autoloader({
        debug: true,
        onLoad: onComponentLoad
      });
      currentAutoloader.start();
    }

    // コンポーネントセレクタの変更
    componentSelector.addEventListener('change', (e) => {
      const value = e.target.value;

      // URLパラメータを更新
      const url = new URL(window.location.href);
      if (value) {
        url.searchParams.set('component', value);
      } else {
        url.searchParams.delete('component');
      }
      window.history.pushState({}, '', url);

      // コンポーネントを表示
      showComponent(value || 'empty');
    });

    // 初期化
    sortComponentOptionsByKana(componentSelector);
    const params = new URLSearchParams(window.location.search);
    const initialComponent = params.get('component');

    // Autoloaderを初期化
    initAutoloader();

    // 初期コンポーネントを表示
    if (initialComponent) {
      componentSelector.value = initialComponent;
      showComponent(initialComponent);
    } else {
      showComponent('empty');
    }

    // デバッグ用にグローバルに公開
    window.componentDemos = demos;
    window.loadedComponents = loadedComponents;

    // =====================================
    // コンポーネントプリロード
    // =====================================

    // 即時ロードが必要なコンポーネント（フォーム操作に関わるもの）
    // これらは遅延ロードだとユーザー操作に支障が出る
    const criticalComponents = [
      '/@components/dads/button.js'
    ];

    // バックグラウンドプリロード対象（アイドル時にロード）
    const componentAdapters = [
      '/@components/dads/table.js',
      '/@components/dads/table-control.js',
      '/@components/dads/textarea.js',
      '/@components/dads/input-text.js',
      '/@components/dads/file-upload.js',
      '/@components/dads/select.js',
      '/@components/dads/calendar.js',
      '/@components/dads/date-picker.js',
      '/@components/dads/dialog.js',
      '/@components/dads/drawer.js',
      '/@components/dads/header-container.js',
      '/@components/dads/hamburger-menu-button.js',
      '/@components/dads/mobile-menu.js',
      '/@components/dads/device-mock.js',
      '/@components/dads/checkbox.js',
      '/@components/dads/radio.js',
      '/@components/dads/chip-label.js',
      '/@components/dads/chip-tag.js',
      '/@components/dads/accordion-details.js',
      '/@components/dads/accordion-item-details.js',
      '/@components/dads/blockquote.js',
      '/@components/dads/divider.js',
      '/@components/dads/heading.js',
      '/@components/dads/text.js',
      '/@components/dads/switch.js',
      '/@components/dads/resource-list.js',
      '/@components/dads/menu-list.js',
      '/@components/dads/menu-list-box.js',
      '/@components/dads/global-menu.js',
      '/@components/dads/utility-link.js',
      '/@components/dads/language-selector.js',
      '/@components/dads/notification-banner.js',
      '/@components/dads/emergency-banner.js',
      '/@components/dads/carousel.js'
    ];

    // クリティカルコンポーネントを即座にロード
    function loadCriticalComponents() {
      console.log('[Preloader] Loading critical components...');
      for (const path of criticalComponents) {
        import(path).then(() => {
          console.log(`[Preloader] Critical: ${path} loaded`);
        }).catch(err => {
          console.warn(`[Preloader] Failed to load ${path}:`, err);
        });
      }
    }

    // 即座に実行
    loadCriticalComponents();

    function preloadComponents() {
      console.log('[Preloader] Starting background preload...');
      const promises = componentAdapters.map(path => {
        const link = document.createElement('link');
        link.rel = 'modulepreload';
        link.href = path;
        document.head.appendChild(link);
        return new Promise(resolve => {
          link.onload = resolve;
          link.onerror = resolve; // エラーでも継続
        });
      });
      Promise.all(promises).then(() => {
        console.log('[Preloader] Background preload complete');
      });
    }

    // requestIdleCallbackが使えない場合はsetTimeoutでフォールバック
    if ('requestIdleCallback' in window) {
      requestIdleCallback(preloadComponents, { timeout: 2000 });
    } else {
      setTimeout(preloadComponents, 100);
    }
  </script>
