    stability: stable
  - id: "search-results"
    title: "検索結果一覧"
    stability: stable
  - id: "table-with-pagination"
    title: "テーブル + ページネーション"
    stability: stable
  - id: "card-grid"
    title: "カードグリッド"
    stability: stable
  - id: "layout-website-hero-section-footer"
    title: "レイアウト（Website: Hero + Section + Footer）"
    stability: stable
  - id: "layout-app-shell"
    title: "レイアウト（App/SaaS: Header + Sidebar + Main）"
    stability: stable
  - id: "layout-master-detail"
    title: "レイアウト（Master-Detail: Main + Aside）"
    stability: stable
  - id: "application-form-single-validation"
    title: "申請フォーム（1ページ・検証エラー）"
    stability: experimental
  - id: "application-form-step-validation"
    title: "申請フォーム（ステップ・検証エラー）"
    stability: experimental
  - id: "mockup-website"
    title: "モックアップ（Website）"
    stability: stable
  - id: "mockup-app-shell"
    title: "モックアップ（App Shell）"
    stability: stable
  - id: "mockup-mobile-form"
    title: "モックアップ（Mobile Form）"
    stability: stable

# ============================================================
# ビルド・検証コマンド
# ============================================================
build_system:
  dev_server: "npm run dev  # = bun --watch serve.ts (serve.ts → server.ts)"
  dev_server_alt: "bun server.ts  # 直接起動も可"
  build: "npm run build  # = tsc && vite build"
  test: "npm run test"
  tdd: "npm run tdd  # = npm run test:watch"
  type_check: "npm run type-check  # = tsc --noEmit"
  lint: "npm run lint  # = eslint src/**/*.ts"
  format: "npm run format  # = prettier --write src/**/*.ts"
  ci: "npm run ci  # = type-check + test:run + build"
  cem_analyze: "npm run cem:analyze  # CEM更新 (custom-elements.json)"
  validate_templates: "npm run validate:templates:quick"
  agents_verify: "npm run agents:verify  # PR前必須"
  agents_pre_pr: "npm run agents:pre-pr  # 軽量事前チェック"
  update_tokens: "npm run update-tokens"
  check_tokens: "npm run check-tokens"

# ============================================================
# CLIツール
# ============================================================
cli_tools:
  wcf: "scripts/wcf/cli.js"  # wcf init, wcf vendor install, wcf page create
  dads_template: "scripts/dads-template/cli.js"  # validate templates, collect gaps, escalate gaps

# ============================================================
# 重要ファイルパス
# ============================================================
key_paths:
  components: "packages/components/"
  core: "packages/core/web-components.ts"
  styles: "packages/styles/"
  utils: "packages/utils/"
  cem: "custom-elements.json"
  cem_config: "custom-elements-manifest.config.js"
  pattern_registry: "registry/pattern-registry.json"
  install_registry: "registry/install-registry.json"
  viewer: "viewer.html"
  demos: "src/demos.ts"
  skills: ".claude/skills/"
  rules: "docs/rules/"
  server: "server.ts"
  server_wrapper: "serve.ts"
