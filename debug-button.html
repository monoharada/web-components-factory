<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Button Debug</title>
  <script type="module">
    import { DadsButton } from './packages/components/button/button.js';
    
    // 手動でコンポーネントを登録
    if (!customElements.get('dads-button')) {
      DadsButton.define();
    }
    
    // デバッグ情報を表示
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const button = document.querySelector('dads-button');
        if (button && button.shadowRoot) {
          // Shadow rootのスタイルシート情報
          console.log('===== Shadow Root Debug Info =====');
          console.log('adoptedStyleSheets:', button.shadowRoot.adoptedStyleSheets);
          
          // 最初のボタン要素を取得
          const baseButton = button.shadowRoot.querySelector('[part="base"]');
          if (baseButton) {
            const styles = window.getComputedStyle(baseButton);
            
            // CSS変数の値を確認
            console.log('===== CSS Variables =====');
            const host = button;
            const hostStyles = window.getComputedStyle(host);
            
            console.log('Host element CSS variables:');
            console.log('--dads-button-background:', hostStyles.getPropertyValue('--dads-button-background'));
            console.log('--button-primary-bg:', hostStyles.getPropertyValue('--button-primary-bg'));
            console.log('--color-primitive-blue-1000:', hostStyles.getPropertyValue('--color-primitive-blue-1000'));
            
            console.log('\nButton element computed styles:');
            console.log('background-color:', styles.backgroundColor);
            console.log('color:', styles.color);
            console.log('border:', styles.border);
            console.log('padding:', styles.padding);
            console.log('min-height:', styles.minHeight);
          }
        }
      }, 500);
    });
  </script>
</head>
<body>
  <h1>Button Debug</h1>
  
  <dads-button variant="solid">Test Button</dads-button>
  
  <h2>Expected behavior:</h2>
  <ul>
    <li>Blue background (#0017c1)</li>
    <li>White text (#ffffff)</li>
    <li>2px solid blue border</li>
    <li>Min height 48px</li>
  </ul>
  
  <p>Open DevTools console to see debug information.</p>
</body>
</html>
