name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Generate Custom Elements Manifest
        run: npm run cem:analyze

      - name: Ensure custom-elements.json is up to date
        run: git diff --exit-code custom-elements.json

      - name: Validate Web Components markup
        run: npm run validate:wc

      - name: Type Check / Test / Build
        run: npm run ci
