name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Validate WCF channel lock
        run: npm run wcf:channel:check

      - name: Detect lock file changes
        id: changed-files
        uses: dorny/paths-filter@v3
        with:
          filters: |
            channel_lock:
              - 'registry/wcf-channel-lock.json'

      - name: Smoke stable channel lock (npm exec)
        if: steps.changed-files.outputs.channel_lock == 'true'
        run: |
          SPEC="$(node -e "const fs=require('node:fs'); const lock=JSON.parse(fs.readFileSync('registry/wcf-channel-lock.json','utf8')); process.stdout.write('git+' + lock.channels.stable.repo + '#' + lock.channels.stable.sha);")"
          WCF_PACKAGE="$SPEC" npm run wcf:smoke:npm

      - name: Generate Custom Elements Manifest
        run: npm run cem:analyze

      - name: Ensure custom-elements.json is up to date
        run: git diff --exit-code custom-elements.json

      - name: Contracts check (autoload / install metadata)
        run: npm run contracts:check

      - name: Ensure install registry is up to date
        run: npm run registry:check

      - name: Validate pattern registry (UI recipes)
        run: npm run patterns:check

      - name: Validate Web Components markup
        run: npm run validate:wc

      - name: Validate demo code blocks
        run: npm run validate:demo-code-block

      - name: Type Check / Test / Build
        run: npm run ci

      - name: Build Pages output
        run: npm run pages:build

      - name: Sanity check output is Viewer
        run: node scripts/check-pages-output.cjs

      - name: Check local-only demo assets
        run: npm run assets:check:local

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check asset requests (404 / external)
        run: npm run pages:check:assets
