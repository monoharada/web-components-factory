name: WCF Skills Weekly Metrics
about: wcf-* Skills の週次運用メトリクスを記録する
labels: ["metrics", "wcf-skills"]
title: "[wcf-skills] weekly metrics YYYY-MM-DD"
body:
  - type: markdown
    attributes:
      value: |
        wcf-* Skills の運用結果を記録してください。
  - type: input
    id: week
    attributes:
      label: Week
      description: 集計週（例 2026-02-11）
      placeholder: 2026-02-11
    validations:
      required: true
  - type: input
    id: request_count
    attributes:
      label: 依頼件数
      placeholder: "0"
    validations:
      required: true
  - type: input
    id: first_pass_rate
    attributes:
      label: 一発成功率（%）
      placeholder: "0-100"
    validations:
      required: true
  - type: textarea
    id: error_distribution
    attributes:
      label: 失敗コード分布
      description: コードと件数（例 `COMPOSE_INSUFFICIENT_INPUT: 3`）
      placeholder: |
        DISCOVERY_INSUFFICIENT_INPUT: 2
        VALIDATE_MCP_UNAVAILABLE: 1
    validations:
      required: true
  - type: input
    id: retries
    attributes:
      label: 再試行回数（合計）
      placeholder: "0"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 学び・改善案
      placeholder: 次週改善する点を簡潔に記入
    validations:
      required: false
